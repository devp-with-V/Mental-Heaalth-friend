# Alembic configuration file — used by `alembic` CLI
# Database URL is intentionally left as a placeholder here.
# The real URL is loaded from settings in alembic/env.py

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Template used to generate migration filenames:
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration file timestamps
timezone = UTC

# Length limit for migration description slug
truncate_slug_length = 40

# Output encoding for migration files
output_encoding = utf-8

# --- Logging config ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
